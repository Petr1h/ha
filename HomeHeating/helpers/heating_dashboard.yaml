# A single dashboard view. In an existing dashboard: Edit dashboard > pencil next to the view tab >
# YAML (or add a new view and open its YAML editor), then paste this whole file.
title: Heating
path: heating
icon: mdi:radiator
type: masonry
cards:
  - type: entities
    title: Boiler
    entities:
      - entity: input_select.heating_mode
        name: Mode
      - entity: input_boolean.heating_season
        name: Heating season
      # Replace with the entity ID of your boiler relay
      - entity: switch.spinac_kotel
        name: Boiler relay
      - entity: input_text.heating_status
        name: Status and reason
      - entity: input_number.heating_demand
        name: Weighted demand
      - entity: input_number.heating_override_duration
        name: Override duration (min)
      # Internal state of the temporary changes, read only
      - entity: input_text.heating_override_store
        name: Override state
  - type: history-graph
    title: Demand and relay
    hours_to_show: 24
    entities:
      - entity: input_number.heating_demand
      # Replace with the entity ID of your boiler relay
      - entity: switch.spinac_kotel

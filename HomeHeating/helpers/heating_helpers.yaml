# Optional helpers for the "Heating - boiler control by room weights" blueprint.
# Copy to config/packages/heating_helpers.yaml (packages must be enabled in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# ) or create the same helpers in Settings > Devices & services > Helpers.
# Then select them in the blueprint (Mode / preset, Heating season, Status text helper, Demand number helper,
# Temporary manual override: state helper and duration helper).

input_select:
  heating_mode:
    name: Heating - mode
    options:
      - none
      - away
      - comfort
      - eco
      - home
      - sleep
      - work from home
      - vacation
    icon: mdi:home-thermometer

input_boolean:
  heating_season:
    name: Heating - season
    icon: mdi:sun-snowflake-variant

input_text:
  heating_status:
    name: Heating - status
    max: 255
    icon: mdi:text-box-search
  # State of the temporary manual changes (turn of a TRV knob). Written only by the automation, max must be 255.
  heating_override_store:
    name: Heating - override state
    max: 255
    icon: mdi:database

input_number:
  heating_override_duration:
    name: Heating - override duration (min)
    min: 15
    max: 240
    step: 15
    initial: 60
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-cog
  heating_demand:
    name: Heating - weighted demand
    min: 0
    max: 100
    step: 0.01
    mode: box
    icon: mdi:fire-circle
